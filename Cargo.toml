[package]
name = "mcp-embedded-ui"
version = "0.3.0"
edition = "2021"
description = "A lightweight embedded Web UI for any MCP Server"
license = "Apache-2.0"
readme = "README.md"
authors = ["aipartnerup <tercel.yi@gmail.com>"]
homepage = "https://aipartnerup.com"
repository = "https://github.com/aipartnerup/mcp-embedded-ui-rust"
documentation = "https://github.com/aipartnerup/mcp-embedded-ui"
keywords = ["mcp", "ui", "explorer", "tools", "model-context-protocol"]
categories = [
    "web-programming",
    "web-programming::http-server",
    "api-bindings",
    "development-tools",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
tracing-subscriber = "0.3"
